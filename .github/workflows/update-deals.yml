name: Update Steam deals

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch deals
        env:
          MAX_DEALS: '300'
          ENRICH_TOP: '80'
        run: node scripts/update-deals.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          git add data/deals.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update Steam deals $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

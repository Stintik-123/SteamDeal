<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="SteamDeal — актуальные скидки Steam. RU / KZ / UA / US." />
  <meta name="theme-color" content="#000000" />
  <title>SteamDeal</title>
  <link rel="preconnect" href="https://shared.akamai.steamstatic.com" />
  <link rel="preconnect" href="https://shared.fastly.steamstatic.com" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="header">
    <div class="wrap header-row">
      <a class="brand" href="./">SteamDeal</a>
      <div class="header-stats">
        <span id="updated">…</span>
        <span id="count" class="dim">—</span>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="intro">
      <h1>Скидки Steam</h1>
      <p>Витрина specials + цены по регионам. Обновление по расписанию через GitHub Actions.</p>
    </section>

    <section class="panel">
      <input id="search" type="search" placeholder="Поиск игры…" autocomplete="off" />
      <div class="row">
        <label>
          Регион
          <select id="region">
            <option value="ru">RU ₽</option>
            <option value="kz">KZ ₸</option>
            <option value="ua">UA ₴</option>
            <option value="us">US $</option>
          </select>
        </label>
        <label>
          Сортировка
          <select id="sort">
            <option value="discount">Скидка</option>
            <option value="price">Цена</option>
            <option value="name">Название</option>
          </select>
        </label>
        <label>
          Мин. %
          <select id="minDiscount">
            <option value="0">0+</option>
            <option value="20">20+</option>
            <option value="50" selected>50+</option>
            <option value="70">70+</option>
            <option value="90">90+</option>
          </select>
        </label>
        <label class="check">
          <input type="checkbox" id="onlyPriced" />
          Только с ценой в регионе
        </label>
      </div>
      <div class="chips" id="chips">
        <button type="button" data-min="0" class="chip">Все</button>
        <button type="button" data-min="50" class="chip active">−50%</button>
        <button type="button" data-min="70" class="chip">−70%</button>
        <button type="button" data-min="90" class="chip">−90%</button>
      </div>
    </section>

    <p id="status" class="status" hidden></p>
    <section id="grid" class="grid"></section>
  </main>

  <footer class="footer wrap">
    <p>Неофициальный проект. Источник — публичные данные Steam Store. Цены ориентировочные.</p>
    <p>
      <a href="https://github.com/Stintik-123/SteamDeal" target="_blank" rel="noopener">GitHub</a>
      ·
      <a href="https://store.steampowered.com/search/?specials=1" target="_blank" rel="noopener">Steam Specials</a>
    </p>
  </footer>

  <script src="assets/app.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="SteamDeal — актуальные скидки Steam. Цены RU / KZ / UA / US." />
  <title>SteamDeal — скидки Steam</title>
  <link rel="preconnect" href="https://shared.akamai.steamstatic.com" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="bg"></div>
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="./">
        <span class="logo-mark">S</span>
        <span class="logo-text">SteamDeal</span>
      </a>
      <div class="header-meta">
        <span id="updated" class="pill">загрузка…</span>
        <span id="count" class="pill muted">—</span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Скидки Steam</h1>
      <p class="hero-sub">Витрина specials + цены по регионам. Данные обновляются автоматически.</p>
    </section>

    <section class="toolbar">
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Поиск по названию…" autocomplete="off" />
      </div>
      <div class="filters">
        <label class="field">
          <span>Регион</span>
          <select id="region">
            <option value="ru">RU ₽</option>
            <option value="kz">KZ ₸</option>
            <option value="ua">UA ₴</option>
            <option value="us">US $</option>
          </select>
        </label>
        <label class="field">
          <span>Сортировка</span>
          <select id="sort">
            <option value="discount">Скидка ↓</option>
            <option value="price">Цена ↑</option>
            <option value="name">Название</option>
          </select>
        </label>
        <label class="field">
          <span>Мин. скидка</span>
          <select id="minDiscount">
            <option value="0">Любая</option>
            <option value="20">от 20%</option>
            <option value="50" selected>от 50%</option>
            <option value="70">от 70%</option>
          </select>
        </label>
      </div>
    </section>

    <section id="status" class="status" hidden></section>
    <section id="grid" class="grid" aria-live="polite"></section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <p>Неофициальный проект. Цены ориентировочные, источник — публичный API Steam Store.</p>
      <p>
        <a href="https://github.com/Stintik-123/SteamDeal" target="_blank" rel="noopener">GitHub</a>
        ·
        <a href="https://store.steampowered.com/" target="_blank" rel="noopener">Steam</a>
      </p>
    </div>
  </footer>

  <script src="assets/app.js" defer></script>
</body>
</html>

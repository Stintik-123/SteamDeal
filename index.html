<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="SteamDeal — витрина скидок Steam. Цены в RU, KZ, UA и US. Не магазин, только ссылки." />
  <meta name="theme-color" content="#0b0f14" />
  <title>SteamDeal — скидки Steam в одном месте</title>
  <link rel="preconnect" href="https://shared.akamai.steamstatic.com" />
  <link rel="preconnect" href="https://cdn.akamai.steamstatic.com" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./" aria-label="SteamDeal">
        <img class="brand-logo" id="logoImg" src="assets/logo.png" alt="" width="34" height="34" />
        <span class="brand-text">
          <strong>SteamDeal</strong>
          <span class="brand-sub">скидки Steam · не магазин</span>
        </span>
      </a>

      <div class="topbar-meta">
        <span class="meta-item" id="updated">—</span>
        <span class="meta-dot"></span>
        <span class="meta-item" id="count">—</span>
        <span class="badge-edition" id="edition">specials</span>
      </div>

      <div class="topbar-actions">
        <button type="button" class="icon-btn" id="themeBtn" title="Светлая / тёмная тема" aria-label="Переключить тему">
          <span class="theme-glyph"></span>
        </button>
        <a class="gh-link" href="https://github.com/Stintik-123/SteamDeal" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="controls" aria-label="Фильтры">
      <div class="controls-row">
        <label class="field field-search">
          <span class="field-label">поиск</span>
          <input id="search" type="search" placeholder="название игры…" autocomplete="off" />
        </label>

        <label class="field">
          <span class="field-label">регион</span>
          <select id="region">
            <option value="ru">Россия ₽</option>
            <option value="kz">Казахстан ₸</option>
            <option value="ua">Украина ₴</option>
            <option value="us">USA $</option>
          </select>
        </label>

        <label class="field">
          <span class="field-label">сортировка</span>
          <select id="sort">
            <option value="discount">скидка %</option>
            <option value="price">цена ↑</option>
            <option value="savings">экономия</option>
            <option value="name">А → Я</option>
          </select>
        </label>

        <label class="field">
          <span class="field-label">мин. скидка</span>
          <select id="minDiscount">
            <option value="0">любая</option>
            <option value="20">от 20%</option>
            <option value="30" selected>от 30%</option>
            <option value="50">от 50%</option>
            <option value="70">от 70%</option>
            <option value="90">от 90%</option>
          </select>
        </label>

        <label class="field">
          <span class="field-label">макс. цена</span>
          <select id="maxPrice">
            <option value="0">без лимита</option>
            <option value="100">до 100</option>
            <option value="200">до 200</option>
            <option value="300">до 300</option>
            <option value="500">до 500</option>
            <option value="1000">до 1000</option>
            <option value="2000">до 2000</option>
          </select>
        </label>

        <button type="button" class="reset-btn" id="resetFilters">сбросить</button>
      </div>

      <div class="chips">
        <div class="chip-row" id="discChips" data-kind="discount">
          <button type="button" class="chip" data-min="0">все %</button>
          <button type="button" class="chip on" data-min="30">−30</button>
          <button type="button" class="chip" data-min="50">−50</button>
          <button type="button" class="chip" data-min="70">−70</button>
          <button type="button" class="chip" data-min="90">−90</button>
        </div>
        <div class="chip-row" id="priceChips" data-kind="price">
          <button type="button" class="chip on" data-max="0">любая цена</button>
          <button type="button" class="chip" data-max="100">≤100</button>
          <button type="button" class="chip" data-max="300">≤300</button>
          <button type="button" class="chip" data-max="500">≤500</button>
          <button type="button" class="chip" data-max="1000">≤1000</button>
        </div>
        <div class="chip-row toggles">
          <label class="tog"><input type="checkbox" id="onlyPopular" /> только известные</label>
          <label class="tog"><input type="checkbox" id="onlyPriced" /> есть цена в регионе</label>
          <label class="tog"><input type="checkbox" id="onlyFree" /> только бесплатные</label>
          <label class="tog"><input type="checkbox" id="hideUnknown" /> скрыть без цены</label>
        </div>
      </div>
    </section>

    <section class="section" id="topSection">
      <div class="section-head">
        <h2>Главное сейчас</h2>
        <span class="section-note">максимальные скидки дня</span>
      </div>
      <div id="topRow" class="grid grid-hero"></div>
    </section>

    <section class="section" id="freeBlock" hidden>
      <div class="section-head">
        <h2>Бесплатно</h2>
        <span class="section-note">забрать можно сейчас</span>
      </div>
      <div id="freeRow" class="grid grid-hero"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>Все скидки</h2>
        <p class="status-line" id="status" hidden></p>
      </div>
      <div id="grid" class="grid"></div>
      <div class="more-wrap">
        <button type="button" id="moreBtn" class="more-btn" hidden>ещё</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p>
        <strong>SteamDeal</strong> — неофициальная витрина скидок. Цены ориентировочные,
        источник — публичные данные Steam Store.
      </p>
      <p class="footer-links">
        <a href="https://github.com/Stintik-123/SteamDeal" target="_blank" rel="noopener">GitHub</a>
        <a href="https://store.steampowered.com/search/?specials=1" target="_blank" rel="noopener">Steam Specials</a>
        <span>Stintik</span>
      </p>
    </div>
  </footer>

  <script src="assets/app.js" defer></script>
</body>
</html>
